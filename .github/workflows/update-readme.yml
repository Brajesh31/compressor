name: README Freshness Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm README exists and is non-empty
        run: test -s README.md
      - name: Validate referenced local documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          readme = Path("README.md").read_text(encoding="utf-8")
          links = re.findall(r"!?\[[^\]]*\]\(([^)]+)\)", readme)
          missing = []
          for link in links:
              if link.startswith(("http://", "https://", "#", "mailto:")):
                  continue
              target = link.split("#", 1)[0]
              if target and not (Path("README.md").parent / target).exists():
                  missing.append(link)
          if missing:
              raise SystemExit("Missing README targets: " + ", ".join(missing))
          print(f"Checked {len(links)} README links.")
          PY
