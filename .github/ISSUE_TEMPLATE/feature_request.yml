name: "✨ Feature request"
description: Propose a useful CLI or compression workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Filesystem, overwrite, and data-loss considerations
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
